<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV ATS - Azriel Fidzlie</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" href="https://www.azriel.id/favicon.ico" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <button id="print-btn" onclick="window.print()">Download PDF</button>

    <div id="cv-content" class="container">
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const contentDiv = document.getElementById("cv-content");

        try {
          const response = await fetch("template.md");
          const text = await response.text();

          contentDiv.innerHTML = marked.parse(text);

          if (!localStorage.getItem("cv_downloaded")) {
            setTimeout(() => {
              const wantDownload = confirm(
                "Welcome! Do you want to download this CV (Save as PDF)?",
              );
              if (wantDownload) {
                window.print();
              }
              localStorage.setItem("cv_downloaded", "true");
            }, 800);
          }
        } catch (err) {
          contentDiv.innerHTML =
            "<p>Gagal memuat template CV. Pastikan file template.md tersedia.</p>";
          console.error(err);
        }
      });
    </script>
  </body>
</html>
